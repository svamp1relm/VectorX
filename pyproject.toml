[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectorx"
version = "0.1.0"
description = "VectorX research simulation platform"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
vectorx = "vectorx.cli:main"

[project.optional-dependencies]
postgres = [
    "sqlalchemy>=2",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vectorx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection convention is `Depends(...)` as a default
# argument value — the exact pattern flake8-bugbear's B008 warns against
# for ordinary functions, but required and idiomatic here.
"api/*.py" = ["B008"]
