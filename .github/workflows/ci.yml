name: CI

on:
  push:
    branches: [master, research-platform-v1]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install PostgreSQL test server tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          pg_bin="$(dirname "$(find /usr/lib/postgresql -type f -name initdb | sort | head -n 1)")"
          echo "$pg_bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: uv sync --all-extras --locked
      - name: Backend tests
        run: uv run pytest
      - name: Ruff
        run: uv run ruff check .
      - name: Validate Docker Compose
        run: docker compose config

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Component tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Python dependencies
        run: uv sync --all-extras --locked
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: ./scripts/e2e.sh
